[project]
name = "kubecompass-backend"
version = "0.1.0"
description = "KubeCompass: AI-native conference discovery API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "elasticsearch>=9.1,<10",
    "networkx>=3.4,<4",
    "scipy>=1.14,<2",
    "numpy>=2.1,<3",
    "fastembed>=0.5,<1",
    "anthropic>=0.70",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.2",
    "openai>=1.60,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
]

[project.scripts]
kubecompass = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Elasticsearch (KUBECOMPASS_ES_URL)",
    "evaluation: search-quality evaluation runs",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
