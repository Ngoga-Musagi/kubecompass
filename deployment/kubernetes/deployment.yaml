apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecompass
  labels: {app.kubernetes.io/name: kubecompass}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kubecompass}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kubecompass}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: kubecompass-app:latest # build: docker build -f deployment/docker/app.Dockerfile -t kubecompass-app .
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 7860}
          envFrom:
            - configMapRef: {name: kubecompass-config}
            - secretRef: {name: kubecompass-secrets} # KUBECOMPASS_ES_URL, KUBECOMPASS_ES_API_KEY, OPENAI_API_KEY
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
