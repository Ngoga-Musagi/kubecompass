# Curated cloud-native vocabulary used for dictionary-based entity extraction.
#
# This is domain knowledge, not conference data: an entry only becomes visible in
# the product when real session/speaker text matches it, and every match keeps
# the sentence it was found in as evidence (origin: extracted).
#
# Fields: id, name, aliases (matched case-insensitively on word boundaries),
#   cs_aliases (case-sensitive aliases, for acronyms), parents (topic/technology ids;
#   curated PART_OF edges), source_tags (explicit source category values that map here).
version: "2026-11-09"

# Broad topics that need stronger evidence (a title mention or 2+ abstract mentions).
strict_match: [security, performance, observability, open-source-community,
  workload-orchestration, storage, identity-access]
# Near-universal entities at a cloud-native event: kept in the graph but damped in
# ranking and ignored as "shared interest" evidence between sessions.
low_signal: [project:kubernetes, topic:security, topic:performance, topic:observability,
  topic:open-source-community, topic:workload-orchestration]

